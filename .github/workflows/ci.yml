name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.9-alpine
        env:
          POSTGRES_USER: bots
          POSTGRES_PASSWORD: test
          POSTGRES_DB: bot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U bots -d bot_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      selenium:
        image: selenium/standalone-chrome:4.51.0-20261010
        ports: ['4444:4444']
        options: --shm-size=2g --add-host=host.docker.internal:host-gateway
    env:
      DATABASE_URL: postgresql+psycopg://bots:test@127.0.0.1:5432/bot_test
      TEST_DATABASE_URL: postgresql+psycopg://bots:test@127.0.0.1:5432/bot_test
      SELENIUM_TEST_URL: http://127.0.0.1:4444
      TEST_FIXTURE_HOST: host.docker.internal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.lock
        working-directory: backend
      - run: python -m pip install --no-deps -e .
        working-directory: backend
      - run: python -m compileall -q app && ruff check . && mypy app && python -m pytest -q
        working-directory: backend
      - run: BROWSER_TEST_MODE=HEADFUL python -m pytest -q tests/test_browser_fixture.py -k 'not live'
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund && npm run typecheck && npm run build
        working-directory: frontend
